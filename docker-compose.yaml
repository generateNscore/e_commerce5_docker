services:
  web:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy  # Waits for the healthcheck to pass


  db:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}

#    volumes:
#      - postgres_data:/var/lib/postgresql/data
    # This tells Docker: "Even though the database is inside a container, save the actual data safely on my physical computer's hard drive so it doesn't get wiped out when I stop the container."

    healthcheck: # Ensures Postgres is ready to accept connections
      test: [ "CMD-SHELL", "pg_isready -U postgres -d db_docker" ]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: